<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lexio Rent</title>

</head>

    <img src="../icons/icon-32.png" alt="" width="20" height="20">
    <strong id="org">Lexio Rent</strong>

  <footer><a href="https://lexio.rent/en/car-rental-software" target="_blank" rel="noopener">lexio.rent</a> · <a href="https://docs.lexio.rent" target="_blank" rel="noopener">API docs</a></footer>
